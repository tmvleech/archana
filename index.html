<!DOCTYPE html>
<html>
<head>
    <title>Will You Be My Valentine, Archana? ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff4e8b, #ff758c);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
            text-align: center;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
        }

        .buttons {
            margin-top: 30px;
            position: relative;
            height: 200px;
        }

        button {
            padding: 12px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            position: absolute;
        }

        #yesBtn {
            background: #28a745;
            color: white;
            left: 40%;
            top: 50%;
        }

        #noBtn {
            background: #dc3545;
            color: white;
            left: 60%;
            top: 50%;
        }

        #message {
            margin-top: 20px;
            font-size: 1.1rem;
            min-height: 40px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Archana ❤️<br>Will You Be My Valentine?</h1>

    <div class="buttons">
        <button id="yesBtn" onclick="yesClicked()">Yes 💖</button>
        <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No 😢</button>
    </div>

    <div id="message"></div>
</div>

<script>
    const noBtn = document.getElementById("noBtn");
    const message = document.getElementById("message");

    const romanticLines = [
        "Are you sure? My heart will cry 😭❤️",
        "But I already imagined our future together 🥺💞",
        "Please don't break my heart, Archana 💔",
        "I promise unlimited chocolates 🍫💕",
        "Think again… I’m already yours 😘",
        "Even the stars ship us ✨💖",
        "You can’t escape destiny 😌❤️"
    ];

    function moveButton() {
        const container = document.querySelector(".buttons");

        const maxX = container.clientWidth - noBtn.clientWidth;
        const maxY = container.clientHeight - noBtn.clientHeight;

        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;

        noBtn.style.left = randomX + "px";
        noBtn.style.top = randomY + "px";

        const randomLine = romanticLines[Math.floor(Math.random() * romanticLines.length)];
        message.innerText = randomLine;
    }

    function yesClicked() {
        document.body.innerHTML = `
            <div style="
                height:100vh;
                display:flex;
                justify-content:center;
                align-items:center;
                background:linear-gradient(135deg,#ff4e8b,#ff758c);
                font-family:Arial;
                color:white;
                text-align:center;
                font-size:2.5rem;
            ">
                🎉 Yayyy Archana Said YES! 💖<br>
                Our Love Story Begins 💞✨
            </div>
        `;
    }
</script>

</body>
</html>
