<!DOCTYPE html>
<html>
<head>
<title>Archana ❤️ My Valentine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#ff0844,#ffb199);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* Intro */
#intro{
    position:fixed;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
    cursor:pointer;
}

#intro h1{
    font-size:2rem;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.1);}
    100%{transform:scale(1);}
}

/* Card */
.card{
    position:relative;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);
    padding:50px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
    width:90%;
    max-width:500px;
    z-index:2;
}

.photo{
    width:140px;
    height:140px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
    margin-bottom:20px;
}

h1{font-size:1.9rem;}

.buttons{
    margin-top:30px;
    position:relative;
    height:160px;
}

button{
    padding:12px 28px;
    font-size:1.1rem;
    border:none;
    border-radius:30px;
    cursor:pointer;
    position:absolute;
    transition:0.3s ease;
}

#yesBtn{
    background:#00ff99;
    color:black;
    left:20%;
    top:40%;
}

#noBtn{
    background:#ff0033;
    color:white;
    left:55%;
    top:40%;
}

#message{
    margin-top:15px;
    min-height:40px;
}

/* Floating Hearts */
.heart{
    position:absolute;
    font-size:20px;
    animation:floatUp linear infinite;
    opacity:0.8;
}

@keyframes floatUp{
    from{transform:translateY(100vh);}
    to{transform:translateY(-10vh);}
}

/* Fireworks */
.firework{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    animation:explode 1s ease-out forwards;
}

@keyframes explode{
    to{
        transform:scale(15);
        opacity:0;
    }
}

/* YES SCREEN */
#yesScreen{
    position:fixed;
    width:100%;
    height:100%;
    background:linear-gradient(135deg,#ff0844,#ff6a88);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    animation:fadeIn 1s ease;
}

#yesScreen img{
    width:220px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

iframe{display:none;}
</style>
</head>

<body>

<div id="intro">
    <h1>Tap To Start Love Story 💖</h1>
</div>

<div class="card" style="display:none;">
    <img src="IMG-20260214-WA0001.jpg" class="photo">
    <h1>Archana ❤️<br>Will You Be My Valentine?</h1>

    <div class="buttons" id="btnArea">
        <button id="yesBtn">Yes 💖</button>
        <button id="noBtn">No 😢</button>
    </div>

    <div id="message"></div>
</div>

<!-- YES Celebration Screen -->
<div id="yesScreen">
    <img src="IMG-20260214-WA0002.jpg">
    <h1>She Said YESSSS 💍❤️</h1>
    <p>Officially Archana & Me Forever 💞✨</p>
</div>

<!-- Music -->
<iframe id="music"
src="https://www.youtube.com/embed/_WvXWqKk9oE?autoplay=1&loop=1&playlist=_WvXWqKk9oE"
allow="autoplay">
</iframe>

<script>
const intro=document.getElementById("intro");
const card=document.querySelector(".card");
const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");
const message=document.getElementById("message");
const btnArea=document.getElementById("btnArea");
const yesScreen=document.getElementById("yesScreen");

intro.addEventListener("click",()=>{
    intro.style.display="none";
    card.style.display="block";
    document.getElementById("music").style.display="block";
});

/* YOUR CUSTOM DRAMATIC LINES */
const lines=[
"Sachi? 🥺",
"Hein? 😢",
"Itna bhi mat satao 😭",
"Baby you don't love me 🥹",
"Mere se mitti mitti batein karke meko ullu bana diya 😭",
"Sharam toh nahi aarhi hogi 😭",
"Ab mein roo paduga 😭"
];

function moveButton(){
    const areaWidth=btnArea.clientWidth-noBtn.clientWidth;
    const areaHeight=btnArea.clientHeight-noBtn.clientHeight;

    const randomX=Math.random()*areaWidth;
    const randomY=Math.random()*areaHeight;

    noBtn.style.left=randomX+"px";
    noBtn.style.top=randomY+"px";

    message.innerText=lines[Math.floor(Math.random()*lines.length)];
}

noBtn.addEventListener("mouseover",moveButton);
noBtn.addEventListener("click",moveButton);

yesBtn.addEventListener("click",()=>{
    card.style.display="none";
    yesScreen.style.display="flex";
    launchFireworks();
});

/* Floating hearts */
function createHearts(){
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerText="❤️";
    heart.style.left=Math.random()*window.innerWidth+"px";
    heart.style.animationDuration=(3+Math.random()*4)+"s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),7000);
}
setInterval(createHearts,300);

/* Fireworks */
function launchFireworks(){
    for(let i=0;i<50;i++){
        const fw=document.createElement("div");
        fw.className="firework";
        fw.style.background=`hsl(${Math.random()*360},100%,60%)`;
        fw.style.left=Math.random()*window.innerWidth+"px";
        fw.style.top=Math.random()*window.innerHeight+"px";
        document.body.appendChild(fw);
        setTimeout(()=>fw.remove(),1000);
    }
}
</script>

</body>
</html>
