<!DOCTYPE html>
<html>
<head>
    <title>Archana ❤️ My Valentine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #ff0844, #ffb199);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .card {
            position: relative;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            padding: 50px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            z-index: 2;
            width: 90%;
            max-width: 500px;
        }

        .photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .buttons {
            margin-top: 30px;
            position: relative;
            height: 150px;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            position: absolute;
            transition: 0.3s ease;
        }

        #yesBtn {
            background: #00ff88;
            color: black;
            left: 30%;
        }

        #noBtn {
            background: #ff0033;
            color: white;
            left: 60%;
        }

        #message {
            margin-top: 15px;
            min-height: 40px;
            font-size: 1rem;
        }

        /* Floating Hearts */
        .heart {
            position: absolute;
            color: rgba(255,255,255,0.7);
            font-size: 20px;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            from { transform: translateY(100vh); }
            to { transform: translateY(-10vh); }
        }

        /* Fireworks */
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            to {
                transform: scale(20);
                opacity: 0;
            }
        }

        iframe {
            display: none;
        }

    </style>
</head>
<body>

<div class="card">
    <!-- 🔥 ADD HER PHOTO HERE -->
    <img src="IMG-20260214-WA0001.jpg" class="photo">

    <h1>Archana ❤️<br>Will You Be My Valentine?</h1>

    <div class="buttons">
        <button id="yesBtn">Yes 💖</button>
        <button id="noBtn">No 😢</button>
    </div>

    <div id="message"></div>
</div>

<!-- Background Music (Kahani Suno 2.0 YouTube autoplay) -->
<iframe width="0" height="0"
src="https://www.youtube.com/embed/_WvXWqKk9oE?autoplay=1&loop=1&playlist=_WvXWqKk9oE"
allow="autoplay">
</iframe>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const message = document.getElementById("message");

const lines = [
    "Archana please 🥺💔",
    "My heart belongs to you ❤️",
    "Don't run from destiny 😌✨",
    "Even the stars ship us 🌟",
    "You can’t escape love 💞",
    "Say yes and make me happiest 😘"
];

function moveButton() {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 100);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    message.innerText = lines[Math.floor(Math.random() * lines.length)];
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("click", moveButton);

yesBtn.addEventListener("click", () => {
    message.innerText = "She Said YESSSS 💍💖";
    createFireworks();
});

function createHearts() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerText = "❤️";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.animationDuration = (3 + Math.random() * 5) + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 8000);
}

setInterval(createHearts, 300);

function createFireworks() {
    for (let i = 0; i < 30; i++) {
        const fw = document.createElement("div");
        fw.classList.add("firework");
        fw.style.left = Math.random() * window.innerWidth + "px";
        fw.style.top = Math.random() * window.innerHeight + "px";
        document.body.appendChild(fw);
        setTimeout(() => fw.remove(), 1000);
    }
}
</script>

</body>
</html>
